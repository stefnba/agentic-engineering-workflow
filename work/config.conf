# Settings the workflow's scripts read. Every key is optional and falls back to the default shown.
# Commit this file — a clone without it silently uses those defaults.
#
# Format: KEY=value, one per line, no spaces around '='. An environment variable of the same name
# outranks this file for a one-off override.

INTEGRATION_TARGET=main         # branch bundles land on, and bundle branches are cut from
TICKET_MERGE_METHOD=squash      # squash | merge — rebase is refused: the land gate cannot match it
WORKTREE_DIR=.claude/worktrees  # ticket worktrees; the path under it mirrors the branch name
